# openplace — Docker deployment (Rust backend + PostgreSQL).
#
#   docker compose up -d --build
#
# The `frontend/` directory is a git submodule (the wplace web client) that
# the backend serves as static files — initialize it with:
#   git submodule update --init --recursive
services:
  db:
    image: postgres:17-alpine
    ports:
      - 5432:5432
    environment:
      - POSTGRES_DB=openplace
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d openplace"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: ./backend-rs
    env_file: ./.env
    environment:
      - DATABASE_URL=postgres://postgres:password@db:5432/openplace
      - BACKEND_PORT=3000
    volumes:
      # Static frontend served by the backend itself.
      - ./frontend:/app/frontend:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # Built-in probe: no curl/wget needed in the image.
      test: ["CMD", "openplace-backend", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  caddy:
    image: caddy:latest
    ports:
      - 80:8000
      - 443:8080
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ./frontend:/srv/frontend
    environment:
      - BACKEND_HOST=app
      - BACKEND_PORT=3000
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000"]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend2:
    image: node:22-alpine
    ports:
      - 127.0.0.1:3001:3000
    volumes:
      - ./frontend2:/app
    working_dir: /app
    command: sh -c "CI=1 npx pnpm install && npx pnpm build && node .output/server/index.mjs"

volumes:
  pgdata:
