# SonarCloud automatic analysis configuration.
#
# The bundled web clients are vendored code that this repository does not
# maintain: frontend/ is the openplaceteam/frontend git submodule (including
# its pre-built _app/ output) and frontend2/ is the upstream Nuxt client.
# This repository's own code is the Rust backend in backend-rs/, so only
# that is analyzed.
sonar.exclusions=frontend/**, frontend2/**
